[project]
name = "linuxrag"
version = "0.1.0"
description = "Hybrid Linux command document search"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "numpy>=1.26,<3", "jieba>=0.42.1,<1", "python-dotenv>=1,<2", "markdown-it-py>=3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "playwright>=1.48,<2"]

[project.scripts]
linuxrag = "linuxrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linuxrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
